# Octorato Rule Registry — single source of truth for RULE #1 (Wired or Corrupt).
# Every CLAUDE.md rule maps here to its backing mechanism(s) + proof.
# Validated by brain_doctor (D1 schema, D2 anchors, D3 per-rule wiring).
# Phase 0 seed: the already-wired mechanisms, existing script names (renaming is Phase 3).
# Schema: registry/rules.schema.json   Design: docs/architecture/wired-or-corrupt.md
version: 1
rules:
  # ---- META: Rule #1 is self-wired; its mechanism IS brain_doctor + the pre-push gate ----
  - id: META.rule-1-wired-or-corrupt
    title: "RULE #1 — every rule must be wired; unwired = corrupt brain"
    category: META
    source: { file: CLAUDE.md, anchor: "RULE #1" }
    strength: GATE
    firing_mode: [runner, git-hook]
    mechanism:
      - { kind: Gate, canonical_name: brain_doctor.py, firing_event: PrePush, firing_matcher: null }
    proof:
      - { method: FILE_EXISTS, locator: "scripts/brain_doctor.py", expect: present }
      - { method: ANCHOR_PRESENT, locator: "RULE #1", expect: present }
    liveness_required: PRESENT

  - id: META.pre-push-gate
    title: "brain_doctor is invoked from the tracked pre-push hook"
    category: META
    source: { file: CLAUDE.md, anchor: "RULE #1" }
    strength: GATE
    firing_mode: [git-hook]
    mechanism:
      - { kind: Gate, canonical_name: .githooks/pre-push, firing_event: PrePush, firing_matcher: null }
    proof:
      - { method: FILE_EXISTS, locator: ".githooks/pre-push", expect: present }
      - { method: EXIT_CODE, locator: "grep -q OCTORATO-WIRE-GATE .githooks/pre-push", expect: 0 }
    liveness_required: PRESENT

