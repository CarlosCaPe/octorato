- id: CODE.dry-run-first
  title: Dry-run first; ask before shipping generated configs
  category: CODE
  source:
    file: CLAUDE.md
    anchor: Dry-run first
  strength: DETECTOR
  gateable: true
  enforcement: fail-open
  waiver:
    reason: 'v6 D4 audit (2026-07-01): config-ship-verify.py:97 emits permissionDecision ''ask'' (a genuine
      fail-closed-via-ask pause), NOT warn-only as previously stated. But it fires on only 3 hardcoded
      patterns (Datadog dashboard write, wrangler deploy --config/generated, curl POST @file.json). The
      rule ''dry-run first; ask before shipping generated configs'' plus CLAUDE.md ''destructive ops preview
      by default'' is broader than those 3, so the ask path is narrower than the rule. Residual documented,
      waiver kept. A broader deterministic deny of ''ship generated config'' is still not specifiable
      without false positives. Close candidate.'
    expires: '2026-09-30'
    approved_by: operator directive 2026-06-29 (cierra o waiva las 7); v6 D4 audit
  firing_mode:
  - hook
  mechanism:
  - kind: Detector
    canonical_name: config-ship-verify.py
    firing_event: PreToolUse
    firing_matcher: Bash
  proof:
  - method: IN_HOOKS_JSON
    locator: PreToolUse|Bash|config-ship-verify.py
    expect: present
  liveness_required: FIRES
