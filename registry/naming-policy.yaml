# Canonical hook-script naming policy (RULE #1 nomenclature, Phase 3).
# Taxonomy and nomenclature are one: a hook script's NAME decodes to its {strength, event}.
#
#   <prefix>__<event>__<slug>.py
#   prefix: g=GATE  r=REFLEX  d=DETECTOR  m=PRESENCE
#   event:  prompt | pretool-write | pretool-bash | pretool-mcp | posttool | stop | session | prepush
#   slug:   kebab role, no redundant -hook/-gate/-check/-stop/-reminder suffix
#
# Enforcement (brain_doctor check_naming):
#   - A NEW Claude Code hook script (firing_event in the 5 CC events) MUST match the scheme.
#   - If it matches, its prefix MUST agree with the declared mechanism kind (name-reparse assert).
#   - Existing scripts predating this policy are GRANDFATHERED (listed below) and exempt, so we
#     get future consistency with ZERO churn and zero risk to the live hook system.
#   - Infra / runner / git-hook scripts (brain_doctor, ai_sync, check-generic, lineage-doctor,
#     install-runners, memory_sync, gate-check) keep stable command names and are NOT hook-scoped,
#     so this policy never applies to them.
scheme: '^[grmd]__(prompt|pretool-write|pretool-bash|pretool-mcp|posttool|stop|session|prepush)__[a-z0-9-]+\.py\Z'
grandfathered:
  - 4d-reminder.py
  - cadence-lint.py
  - cadence-stop-hook.py
  - claim-verify-stop.py
  - config-ship-verify.py
  - connectome-heartbeat.py
