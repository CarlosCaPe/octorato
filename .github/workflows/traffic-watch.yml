name: Octorato Traffic Watch

# Daily watcher for repo traffic. Pulls Clones / Views / Stars / Forks
# from the Traffic API, compares against the prior snapshot stored in
# .metrics/traffic_history.json, and opens a GitHub Issue when a spike
# is detected. Commits the fresh snapshot back so the comparison window
# is always rolling.
#
# Required SECRETS:
#   OCTORATO_PAT — Fine-grained PAT scoped to CarlosCaPe/octorato with
#                  - Administration: Read    (REQUIRED for /traffic/* endpoints)
#                  - Contents:       Read+Write  (commit traffic_history.json)
#                  - Issues:         Read+Write  (open spike-alert issues)
#                The default GITHUB_TOKEN cannot reach the Traffic API
#                because it has no Administration scope — only a PAT can
#                grant it. Rotate every ~90 days.

on:
  schedule:
    # 18:00 UTC daily = post US-East close + LATAM peak hours captured.
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      force_alert:
        description: 'Open an issue even if no spike (for testing the alert path)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write
  issues:   write

concurrency:
  group: traffic-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # PAT instead of GITHUB_TOKEN so the eventual `git push` of the
          # snapshot file uses credentials with write access (the PAT) and
          # so the python step inherits the same auth for the Traffic API.
          token: ${{ secrets.OCTORATO_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run traffic check
        env:
          GITHUB_TOKEN: ${{ secrets.OCTORATO_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FORCE_ALERT: ${{ github.event.inputs.force_alert }}
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "::error::OCTORATO_PAT secret not set — see .github/workflows/traffic-watch.yml header for required scopes"
            exit 2
          fi
          python3 scripts/check_traffic.py

      - name: Commit updated history if changed
        run: |
          git config user.name  'octorato-traffic-bot'
          git config user.email 'octorato-traffic-bot@users.noreply.github.com'
          if ! git diff --quiet -- .metrics/traffic_history.json; then
            git add .metrics/traffic_history.json
            git commit -m "metrics: traffic snapshot $(date -u +%Y-%m-%d)"
            git push
          else
            echo "no state change to commit"
          fi
