name: Brain PR Checks

# Pre-merge gate for the octorato brain repo.
#
# Checks:
#   0. kernel-suite — the v8 unit suite on a POSIX and a Windows runner.
#      It ran only in pre-push before, i.e. only on the author's machine.
#   1. check-generic — verifies no client / arm tokens leaked into the
#      staged diff or commit metadata. The brain is public on GitHub;
#      any client-specific string must be caught BEFORE merge.
#   2. connectome-rebuild — verifies generate_neural_map.py still runs
#      without error and the output is valid JSON. Protects against
#      malformed skill / agent definitions silently breaking the graph.
#
# Why this exists: until 2026-05-20, the brain had only `traffic-watch.yml`
# (analytics). Nothing validated PRs. Adding the minimum guardrails so
# a future "innocent" PR can't silently corrupt the brain or leak a
# client name to the public repo.

on:
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  kernel-suite:
    # The v8 kernel suite ran ONLY in `.githooks/pre-push`, which means it ran only
    # on the author's own box. Issue #300 is the consequence: 42 of 208 tests fail on
    # Windows 11 against a clean master, and because pre-push is fail-closed, no push
    # is possible from a Windows machine at all. Nobody saw it because CI never ran
    # the suite on any platform, let alone a second one.
    #
    # The Windows leg is `continue-on-error` ON PURPOSE and it is not a soft-fail in
    # disguise: it is red today by construction, so making it required now would block
    # every PR on a defect this job exists to REPORT. It reports until #300 is closed;
    # promoting it to required is the last step of that issue, not of this one, and the
    # step below prints that promotion instruction on every red run so the temporary
    # state cannot quietly become permanent.
    name: kernel suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The suite reads registry/*.yaml, so PyYAML is a test dependency, not an
      # optional one. A runner without it turns test_octo_replay's orphan-rule check
      # into an ERROR rather than a failure, which reads as an environment problem
      # and hides the check that was supposed to run.
      - name: Install the suite's dependencies
        shell: bash
        run: python -m pip install --quiet pyyaml

      - name: Run the kernel test suite
        shell: bash
        working-directory: scripts
        run: |
          set -o pipefail
          # `discover`, not a list of module names. A hand-written roster is the
          # thing that goes stale: a test file added without touching this file
          # would simply never run, and the job would stay green having skipped it.
          # Measured on this tree: discovery finds all 8 modules, 208 tests.
          # The guard below is what makes discovery safe to trust, because a
          # discovery that silently finds nothing also exits 0.
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee ../suite.log
        continue-on-error: true

      - name: Report the tally, and fail the POSIX leg on any red
        shell: bash
        run: |
          tail -n 3 suite.log
          ran=$(grep -oE '^Ran [0-9]+ test' suite.log | grep -oE '[0-9]+' | tail -1)
          if [ -z "$ran" ] || [ "$ran" -eq 0 ]; then
            echo "::error::the suite reported no tests; a run of zero is not a pass"
            exit 1
          fi
          if grep -qE '^(FAILED|ERROR)' suite.log; then
            if [ "${{ matrix.os }}" = "windows-latest" ]; then
              echo "::warning::Windows leg red — this is issue #300, reported not enforced."
              echo "::warning::When it goes green, drop continue-on-error and make this check required."
              exit 0
            fi
            echo "::error::suite red on ${{ matrix.os }}"
            exit 1
          fi
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            echo "::notice::Windows leg GREEN — close #300 by making this check required."
          fi

  check-generic:
    name: No client / arm tokens leaked
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run check-generic against PR diff
        run: |
          set -e
          if [ ! -f scripts/check-generic.py ]; then
            echo "::warning::scripts/check-generic.py not found — skipping"
            exit 0
          fi
          # The blocklist file (company/brain-blocklist.txt) is gitignored
          # by design — operators keep their per-shop blocklist private.
          # In CI we have no blocklist, so check-generic will pass trivially
          # (zero tokens loaded). The real guard runs locally via pre-commit.
          # This CI step exists to fail LOUDLY if check-generic itself is
          # broken (parse errors, missing deps), not to enforce blocking.
          BASE_SHA="$(git merge-base origin/${{ github.base_ref }} HEAD)"
          DIFF=$(git diff "$BASE_SHA"..HEAD --no-color || true)
          COMMIT_MSGS=$(git log --format=%B "$BASE_SHA"..HEAD || true)
          printf '%s\n%s\n' "$DIFF" "$COMMIT_MSGS" > /tmp/pr-content.txt
          python3 scripts/check-generic.py --message-file /tmp/pr-content.txt || {
            echo "::error::check-generic.py rejected the PR — client / arm token in diff or commit message."
            exit 1
          }

  connectome-rebuild:
    name: neural_map.json rebuilds cleanly
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate connectome (dry-run via temp output)
        env:
          # generate_neural_map.py reads from Path.home() / ".claude" / "skills".
          # In CI the brain repo IS the checkout root, so point HOME there so
          # `~/.claude/skills` resolves to `<checkout>/skills`.
          HOME: ${{ github.workspace }}/..
        run: |
          set -e
          if [ ! -f scripts/generate_neural_map.py ]; then
            echo "::warning::scripts/generate_neural_map.py not found — skipping"
            exit 0
          fi
          # Symlink the checkout into a fake ~/.claude so the script's
          # Path.home() / ".claude" path lookups resolve.
          mkdir -p "$HOME"
          ln -sfn "${{ github.workspace }}" "$HOME/.claude"
          python3 scripts/generate_neural_map.py >/dev/null
          python3 -c "import json; json.load(open('neural_map.json'))"
          echo "✓ connectome regenerated and validated"

  lineage-sound:
    name: lineage graph is sound (no dangling edges / cycles)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run lineage-doctor (fail-closed)
        run: |
          set -e
          if [ ! -f scripts/lineage-doctor.py ] || [ ! -f connectome/lineage.yaml ]; then
            echo "::warning::lineage-doctor or connectome/lineage.yaml not found — skipping"
            exit 0
          fi
          pip install --quiet pyyaml
          python3 scripts/lineage-doctor.py || {
            echo "::error::lineage graph is unsound — a seek over it would lie. Fix connectome/lineage.yaml."
            exit 1
          }

  counts-render:
    name: README/FAQ counts are rendered (no stale floors)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pyyaml

      # Re-render the stat floors + canon facts, then fail if the tree moved.
      # Why: the renderers only ran inside ai-push; a day of worktree-PR merges
      # (2026-06-03) left README/FAQ floors stale until an operator noticed.
      # This makes the render a merge requirement instead of a ritual.
      - name: Render counts + canon, fail on drift
        run: |
          python3 scripts/sync-readme-counts.py --floor
          python3 scripts/canon-render.py
          if ! git diff --exit-code; then
            echo '::error::Stale rendered counts/canon. Run: python3 scripts/sync-readme-counts.py --floor && python3 scripts/canon-render.py — then commit the result.'
            exit 1
          fi
