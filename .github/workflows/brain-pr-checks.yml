name: Brain PR Checks

# Pre-merge gate for the octorato brain repo.
#
# Two checks:
#   1. check-generic — verifies no client / arm tokens leaked into the
#      staged diff or commit metadata. The brain is public on GitHub;
#      any client-specific string must be caught BEFORE merge.
#   2. connectome-rebuild — verifies generate_neural_map.py still runs
#      without error and the output is valid JSON. Protects against
#      malformed skill / agent definitions silently breaking the graph.
#
# Why this exists: until 2026-05-20, the brain had only `traffic-watch.yml`
# (analytics). Nothing validated PRs. Adding the minimum guardrails so
# a future "innocent" PR can't silently corrupt the brain or leak a
# client name to the public repo.

on:
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  check-generic:
    name: No client / arm tokens leaked
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run check-generic against PR diff
        run: |
          set -e
          if [ ! -f scripts/check-generic.py ]; then
            echo "::warning::scripts/check-generic.py not found — skipping"
            exit 0
          fi
          # The blocklist file (company/brain-blocklist.txt) is gitignored
          # by design; in CI we can't see it. The check-generic.py script
          # has a `--ci-mode` flag (if present) or a default-fail fallback.
          # We invoke it with the merge-base as the diff baseline.
          BASE_SHA="$(git merge-base origin/master HEAD 2>/dev/null || git merge-base origin/main HEAD)"
          python3 scripts/check-generic.py --since "$BASE_SHA" || {
            echo "::error::check-generic.py rejected the PR — client / arm token in diff or commit message."
            exit 1
          }

  connectome-rebuild:
    name: neural_map.json rebuilds cleanly
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate connectome (dry-run via temp output)
        run: |
          set -e
          if [ ! -f scripts/generate_neural_map.py ]; then
            echo "::warning::scripts/generate_neural_map.py not found — skipping"
            exit 0
          fi
          # Run the regen and confirm output parses as JSON.
          python3 scripts/generate_neural_map.py >/dev/null
          python3 -c "import json; json.load(open('neural_map.json'))"
          echo "✓ connectome regenerated and validated"
