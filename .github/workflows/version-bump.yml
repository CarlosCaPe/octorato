name: Brain Version Bump

# Moves the semver autolabel (vX.Y.Z) on every merge to master, sized by the
# conventional-commit type of the commits since the last tag (feat -> minor,
# fix/chore/... -> patch, `!`/BREAKING -> major), then emits the GitHub Release.
#
# Why this exists: brain-version-bump.py used to run only as a post-push step of
# `ai-push`. The repo is PR-first with auto-deploy on main, so almost everything
# lands via PR-merge, which bypasses ai-push entirely. The autolabel got stuck
# (e.g. three feat merges left the tag frozen at v3.3.0 while content moved on).
# Running the bump server-side on every push to master decouples the label from the
# manual push path, so it can never silently lag again.
#
# Loop-safe: this job pushes a TAG, and a tag push does not trigger an
# `on: push: branches` workflow, so it never re-triggers itself.
#
# CHANGELOG self-heal (2026-09-06): master is protected (required PRs, required
# checks, enforce_admins), so no job can commit the CHANGELOG entry directly and
# every feat/fix merge left the tag one step ahead of CHANGELOG.md until a human
# opened a docs PR. The `heal` job runs changelog-sync --apply and, when it
# changed something, pushes a bot branch (with the checkout's GITHUB_TOKEN
# credentials, contents: write) and opens a PR with auto-merge armed through
# OCTORATO_PAT: the pull_request event is produced by that API call, and a
# PAT-made PR triggers the required checks, which a GITHUB_TOKEN-made one would
# not. When that PR merges, the `bump` job runs, sees changelog-only commits
# (brain-version-bump's guard) and cuts no tag. Before opening a new heal PR the
# job retires older bot/changelog-* branches (a merged one is not deleted by
# `gh pr merge --auto`, and an open one from a previous tag would only conflict,
# since the new heal carries every missing entry). The heal is docs-only and
# machine-generated, so it merges on the repo's required checks alone (the
# QA-receipt contract governs authored PRs).
#
# Daily, not per merge (2026-10-06): master requires branches to be up to date
# (strict status checks). A heal PR merged minutes after every feature merge
# moved master again and left every other open PR BEHIND, each needing an
# "Update branch" and a fresh QA pass on a new head. So the tag and the Release
# are still cut on every push, while the heal runs once a day (plus
# workflow_dispatch) and changelog-sync writes every tag cut since the last heal
# into ONE PR. The documented lag: CHANGELOG.md may trail the newest tag by up
# to a day; brain_doctor's release-drift only WARNs on that, and the Release
# notes carry the entry in the meantime. The cron sits at 03:17 UTC, outside the
# operator's working hours (UTC+1/+2), so the one daily re-stale lands before
# the day's PRs are opened; minute 17 avoids the top-of-hour queue where GitHub
# delays or drops scheduled runs.

on:
  push:
    branches: [master]
  schedule:
    - cron: '17 3 * * *'   # daily CHANGELOG heal, see header
  workflow_dispatch:       # manual heal

permissions:
  contents: write   # push the annotated tag + create the Release; push the heal branch

concurrency:
  group: brain-version-bump
  cancel-in-progress: false

jobs:
  bump:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + all tags, needed by classify()

      - name: Configure git identity for the annotated tag
        run: |
          git config user.name "octorato-bot"
          git config user.email "octorato-bot@users.noreply.github.com"

      - name: Bump the semver tag and emit the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/brain-version-bump.py --apply --push

  heal:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + all tags, needed by changelog-sync

      - name: Configure git identity for the heal commit
        run: |
          git config user.name "octorato-bot"
          git config user.email "octorato-bot@users.noreply.github.com"

      - name: Heal CHANGELOG.md through a bot PR (auto-merge)
        env:
          GH_TOKEN: ${{ secrets.OCTORATO_PAT }}
        run: |
          set -euo pipefail
          git fetch --tags --quiet
          python3 scripts/changelog-sync.py --apply
          if git diff --quiet -- CHANGELOG.md; then
            echo "changelog: reconciled, nothing to heal"
            exit 0
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::OCTORATO_PAT missing: CHANGELOG needs a manual docs PR (python3 scripts/changelog-sync.py --apply)"
            exit 0
          fi
          tag="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)"
          branch="bot/changelog-${tag}"
          # Retire earlier heal branches: merged ones linger (auto-merge never
          # deletes the head), open ones from an older tag would only conflict
          # with this heal, which carries every missing entry.
          for old in $(git ls-remote --heads origin 'bot/changelog-*' | awk '{print $2}' | sed 's|refs/heads/||'); do
            [ "$old" = "$branch" ] && continue
            state="$(gh pr view --repo "$GITHUB_REPOSITORY" "$old" --json state -q .state 2>/dev/null || echo NONE)"
            if [ "$state" = "OPEN" ]; then
              gh pr close --repo "$GITHUB_REPOSITORY" "$old" --comment "Superseded by the heal for ${tag}." || true
            fi
            git push -q origin --delete "$old" || true
          done
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "changelog: heal branch $branch already exists, leaving it to its PR"
            exit 0
          fi
          git checkout -q -b "$branch"
          git add CHANGELOG.md
          git commit -q -m "docs(changelog): backfill ${tag}" \
            -m "Written by the daily heal in version-bump.yml: changelog-sync --apply wrote every tag up to ${tag} that CHANGELOG.md was missing, promoting the Unreleased body or the Release notes into the dated entries. Docs-only; the bump's changelog-only guard cuts no new tag on merge."
          git push -q -u origin "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base master --head "$branch" \
            --title "docs(changelog): backfill ${tag}" \
            --body "Automated by the daily heal in version-bump.yml: every tag up to ${tag} missing from CHANGELOG.md, in one PR. Docs-only: the bump's changelog-only guard cuts no new tag when this merges, so release-drift converges and the loop closes." \
            || { echo "::warning::gh pr create failed (PAT lacks pull-requests:write?); branch $branch pushed, open the PR by hand"; exit 0; }
          gh pr merge --repo "$GITHUB_REPOSITORY" "$branch" --squash --auto --delete-branch \
            || echo "::warning::auto-merge could not be armed on $branch; merge it by hand once checks pass"
