# connectome/lineage.yaml — the persistent surface/derivation graph.
#
# "El grafo es y ya." The neurons (files, surfaces, concepts) do not connect
# themselves; THIS file is the light that wires them. impact-radius.py SEEKS
# this graph (a deterministic traversal) instead of grep'ing the repo (a
# stochastic, input-dependent table scan that pixelates coverage).
#
# Why this exists: grep answers "which files happen to contain string X" —
# coverage changes with the input and misses off-repo + derived surfaces.
# A declared edge answers "what MUST stay in sync when this changes" — once,
# exactly, every time. Seek > scan: fewer tokens, higher speed, 100% coverage.
#
# Edge kinds:
#   projects_to    source is copied/rendered to derived locations; the derived
#                  copy goes STALE the instant the source changes (publish-time cp).
#   generated_by   target is GENERATED by a script — drift means "regenerate",
#                  NOT a hand-edit skip. Never hand-edit; never count as a miss.
#   claim_maps_to  a prose claim must map to a running file (the "this paper
#                  compiles" invariant — a claim without its file breaks the thesis).
#   appears_in     a shared fact (a count, a coined term) is duplicated in N
#                  places — converge to one value / single-source it.
#
# This file is hand-declared and GENERIC: never name a client arm here (the
# brain is public). Arms are referenced as "<each arm>", resolved at run time
# from the gitignored company/config/arms-paths.json.
#
# Grow it: every time impact-radius.py falls back to grep, it flags an "unlit
# neuron" — add the missing edge here so the next seek is deterministic.

version: 1

edges:
  - id: wiki-publish
    from: docs/wiki/
    to:
      - "octorato.wiki — the GitHub wiki (a SEPARATE repo)"
    kind: projects_to
    offrepo: true
    publish: "publish step = git clone octorato.wiki && cp docs/wiki/*.md (see docs/wiki/README.md)"
    note: >-
      docs/wiki/ is the SOURCE OF TRUTH. Editing the published wiki copy alone
      (without the source) is silently reverted on the next publish. This edge
      is the one that catches that exact skip.

  - id: claude-arm-sync
    from: CLAUDE.md
    to:
      - "<each arm>/.github/copilot-instructions.md"
      - "<each arm>/.cursorrules"
    kind: projects_to
    offrepo: true
    publish: "sync-ai-docs (arms resolved from company/config/arms-paths.json — never named here)"
    note: "A rules change in the brain must reach every arm's copilot/cursor mirror."

  - id: wiki-generated
    from: scripts/generate-octorato-wiki.py
    to:
      - docs/wiki/Home.md
      - docs/wiki/_Sidebar.md
      - docs/wiki/Skills.md
      - docs/wiki/Agents.md
    kind: generated_by
    note: >-
      Counts and lists on these pages are GENERATED from live skill/agent dirs.
      Drift here is "pending regeneration", NOT a hand-edit skip — do not hand-fix.

  - id: skill-count
    concept: "skill count"
    appears_in:
      - README.md
      - docs/wiki/Home.md
      - docs/wiki/_Sidebar.md
      - docs/wiki/Skills.md
      - WHITEPAPER.md
    kind: appears_in
    single_source: "live count of skills/*/SKILL.md; render via sync-readme-counts.py --floor"
    note: "One number, many copies. Change it once at the source and re-render; never hand-edit one copy."

  - id: agent-count
    concept: "agent count"
    appears_in:
      - README.md
      - docs/wiki/Home.md
      - docs/wiki/_Sidebar.md
      - docs/wiki/Agents.md
    kind: appears_in
    single_source: "live count of agents/*.md; render via sync-readme-counts.py --floor"

  - id: whitepaper-compiles
    from: WHITEPAPER.md
    concept: "every claim maps to a running file"
    to:
      - "WHITEPAPER.md §'Implementation — this paper compiles' table (one row per prose claim)"
    kind: claim_maps_to
    note: >-
      Adding a claim in the prose without a row in the compiles-table breaks the
      paper's whole thesis. This edge is the v3.0 same-file-neighbor skip.

  - id: version-bump
    concept: "brain version / release"
    appears_in:
      - CHANGELOG.md
      - WHITEPAPER.md
      - docs/wiki/Self-Growth.md
    kind: appears_in
    note: "A major version (e.g. v3.0) is announced in several places — bump them together."

  # The self-referential edge: the principle "graph before grep (seek > scan)"
  # is itself a concept that must live coherently across the whole brain. This
  # edge is the deterministic 100% target-set for codifying it — and proof that
  # the graph lights its own neuron (we found these by reflection, not grep).
  - id: graph-before-grep
    concept: "graph before grep / seek-not-scan / ¿y el grafo?"
    appears_in:
      - CLAUDE.md                              # §4D ULTRA RULE + Best-Tool-First + footer spec
      - scripts/4d-reminder.py                 # the Provenance footer "Graph:" field
      - scripts/connectome-heartbeat.py        # the latido reflex line
      - scripts/impact-radius.py               # the seek itself (grep = labeled fallback)
      - skills/4d-paradigm-protocol/SKILL.md   # cerebellum + 3D verifies graph-was-used
      - connectome/lineage.yaml                # this graph
      - WHITEPAPER.md                          # §7 Connectome = the index; seek not scan
      - CHANGELOG.md                           # the release entry
      - docs/wiki/The-4D-Paradigm.md           # §8 enforcement + §10 reflexive layer
      - skills/finops-observability/SKILL.md   # the ~100x seek-vs-scan token saving
      - scripts/brain_doctor.py                # an assertion: lineage.yaml present + seek wired
    kind: appears_in
    note: >-
      FinOps: a seek is ~100x cheaper than a scan per lookup (measured ~16 vs
      ~1737 tokens) and converges the WHILE in one beat. Codifying this concept
      must hit EVERY surface above in one deterministic sweep — pixelating it
      would be the very failure it cures.

  # ── Lit on 2026-06-01: the octopus↔OS analysis that birthed two skills. ──
  # These three edges turn the session's unlit neurons into deterministic seeks.

  - id: runtime-adaptation-over-source-edit
    concept: "runtime adaptation over source edit / ARN-not-ADN / edit skill-memory-config-hook not CLAUDE.md core"
    appears_in:
      - skills/runtime-adaptation-over-source-edit/SKILL.md   # the source of truth
      - skills/harmonization-over-accretion/SKILL.md          # lean-core sibling (imports half)
      - skills/skill-creator/SKILL.md                         # the RNA answer "= a new skill"
      - skills/peripheral-parallel-dispatch/SKILL.md          # octopus↔OS sibling
      - skills/octorato-symbolism/SKILL.md                    # the organic-brain anchor
      - CLAUDE.md                                             # Brain-Stays-Generic + Config-first (the DNA layer)
    kind: appears_in
    note: >-
      Default behaviour goes to the runtime layer (skill/memory/hook/config),
      never the core. If the criterion changes, every surface above must stay
      coherent — the core stays lean because this edge says where else it lives.

  - id: peripheral-parallel-dispatch
    concept: "peripheral parallel dispatch / fan-out to arms vs central / 8 arms reconcile not redo"
    appears_in:
      - skills/peripheral-parallel-dispatch/SKILL.md          # the source of truth
      - skills/4d-paradigm-protocol/SKILL.md                  # Delegate (the who-does-it half)
      - skills/orchestrated-planning/SKILL.md                 # multi-agent planning counterpart
      - skills/harmonization-over-accretion/SKILL.md          # restraint on the how-many
      - skills/runtime-adaptation-over-source-edit/SKILL.md   # octopus↔OS sibling
      - CLAUDE.md                                             # The Octopus Architecture + Delegate
    kind: appears_in
    note: >-
      The center sets intent and reconciles (set-equality, schemas, pipeline>barrier);
      it must NOT redo the arms' work. Changing the fan-out criterion must touch
      every surface above so delegation stays coherent end to end.

  - id: octopus-os-mapping
    concept: "octopus↔OS symbolism mapping / octorato symbolism octopus / organic-brain-as-operating-system"
    appears_in:
      - skills/octorato-symbolism/SKILL.md                    # the naming/symbolism anchor
      - skills/runtime-adaptation-over-source-edit/SKILL.md   # RNA-not-DNA instance
      - skills/peripheral-parallel-dispatch/SKILL.md          # 8-arms-parallel instance
      - CLAUDE.md                                             # §The Octopus Architecture
    kind: appears_in
    note: >-
      The umbrella concept: the brain IS an octopus-shaped OS. New instances of
      the octopus↔OS pattern (skills like the two above) must hang off this edge,
      not re-derive the metaphor. Also lights the original 'octorato symbolism
      octopus' seek that fell back to grep on 2026-06-01.

  # ── Lit on 2026-06-03: the memory model — Octorato has 1+N brains, not 9. ──
  - id: memory-two-tier-n-brains
    concept: "two-tier memory / nine brains / 1+N brains / central brain vs arm brains / brain memory vs arm memory / octorato-memory standalone repo / memory sync"
    appears_in:
      - docs/architecture/memory-model.md                     # the source of truth (two tiers, neurobiology)
      - skills/octorato-symbolism/SKILL.md                    # 8→∞ EXTENDS to brains: 9 fixed → 1+N unbounded
      - scripts/memory_sync.py                                # the public mechanism (engine, not data)
      - templates/memory/MEMORY.template.md                  # empty index adopters copy
      - skills/arm-onboarding/SKILL.md                        # a new arm = a new arm-brain (its own .claude/memory)
      - CLAUDE.md                                             # §The Octopus Architecture + Information Flow (memory routing)
      - README.md                                            # brain/arms labels + counts framing
      - docs/wiki/Glossary.md                                # define brain memory / arm memory / 1+N brains
      - docs/wiki/Architecture.md                            # the two-tier memory in the architecture map
      - "<each arm>/.claude/memory/ (symlinked to the harness; sealed arm-brain)"  # off-repo, per-arm
    kind: appears_in
    offrepo: true
    note: >-
      A biological octopus is fixed at 9 brains (1 central + 8 arms). Octorato is
      1+N: one central brain (this repo + the private octorato-memory store) plus
      one sealed arm-brain per arm (<each arm>/.claude/memory, version-controlled
      in the arm's own private repo, loaded via symlink). N is unbounded — the
      8→∞ anchor applied to brains. Routing: a lesson that helps a different
      client distils UP to the central brain; an arm-specific fact stays in the
      arm-brain. Change the memory model and EVERY surface above must stay
      coherent, or the label pixelates. Brain memory data + the private remote URL
      NEVER appear in any public surface (mechanism is public, data is private).

  # ── Lit on 2026-06-03: doc anatomy — every doc is an organ; placement follows morphology. ──
  - id: doc-anatomy-morphology
    concept: "doc anatomy / organ line / morphology-anchored documentation / where docs live / wiki organs vs architecture specs / trace storage / capability inventory"
    appears_in:
      - docs/wiki/Home.md                                     # central brain (the lobby that routes to organs)
      - docs/wiki/_Sidebar.md                                 # the organism's index, ordered by anatomy
      - docs/wiki/Architecture.md                             # anatomy atlas (the canonical organ map)
      - docs/architecture/trace-storage.md                    # sensory nerves (moved here from docs/ root)
      - docs/architecture/capability-inventory.md             # generated census (moved here from docs/ root)
      - docs/architecture/hook-orchestration.md               # nervous-system spec (linked from wiki Architecture)
      - docs/architecture/memory-model.md                     # brain memory spec (1+N)
      - README.md                                             # organism overview (diet: organs carry the depth)
    kind: appears_in
    note: >-
      The documentation IS the organism: docs/wiki/ pages are operator-facing
      ORGANS (each carries a one-line "> **Organ:** ..." anchor under its H1),
      docs/architecture/ holds internal specs, and the root GitHub-special files
      (SECURITY/SUPPORT/CONTRIBUTING) are the skin. A new doc must name its
      organ and live in the layer that matches its reader; a doc that explains
      octopus lore apart from its technique is the pixelation failure this
      edge exists to prevent. Counts on any of these surfaces are canon-owned
      (content/canon.facts.yaml) — never hand-edited.

  # ── Lit on 2026-06-03: the anchor isomorphism — the three anchors share one structure. ──
  - id: anchor-isomorphism-invariant
    concept: "anchor isomorphism / invariant / octopus ∧ linux ∧ tesseract intersection / the three anchors share structure / intersection over quotient-by-synonymy / abstraction = upward learning / structural metaphor not decorative"
    appears_in:
      - skills/octorato-isomorphism/SKILL.md                  # the method (⋂ over V/~ = abstraction; CCA / structure-mapping / GEB isomorphism)
      - skills/octorato-isomorphism/anchors.yaml              # the three descriptor sets + synonym groups + invariant→primitive map (config-first)
      - scripts/octorato-isomorphism.py                       # computes the invariant from the data; no corpus generation
      - skills/octorato-symbolism/SKILL.md                    # OWNS the fractal/self-similar primitive this skill only measures (no fork)
      - skills/harmonization-over-accretion/SKILL.md          # the no-fork stance: two skills, one primitive, measurement ≠ second home
    kind: appears_in
    note: >-
      The three anchors (octopus = architecture, linux = OS, tesseract = 4D) are
      one structure shown three times (an isomorphism). The shared descriptors —
      computed as a set intersection over the quotient-by-synonymy, NOT by brute-
      force corpus generation — ARE the brain's required primitives; the brain
      already embodies all ten. self-similar/fractal lives in octorato-symbolism
      (the WHY); this skill is the MEASUREMENT that proves the metaphor is
      structural. If a new anchor/metaphor is added, run it through the
      intersection: share the invariant or it is decoration, not structure.

  - id: session-isolation
    concept: "session/instance isolation / two live dimensions share one worktree / co-tenancy guard / each session its own git worktree"
    appears_in:
      - skills/session-isolation/SKILL.md                     # canonical principle + protocol + recovery
      - CLAUDE.md                                             # Core Principle #7 (Session/Instance Isolation)
      - scripts/ai_sync.py                                    # ai-push co-tenancy guard (aborts on shared tree)
      - scripts/octo-dim.py                                   # dimension registry (sessions.json) + worktree-init
      - scripts/dimension-awareness-hook.py                   # the "you are NOT isolated" PreToolUse warning
    kind: appears_in
    note: >-
      Session/Instance Isolation = Arm Isolation across time. Canonical in the
      skill + CLAUDE.md #7; ENFORCED by ai-push's co-tenancy abort, octo-dim's
      sessions.json registry, and the dimension-awareness hook. Change the rule,
      reconcile all four enforcement surfaces. Lights the session-isolation seek
      that fell back to grep repeatedly on 2026-06-02/03.

  - id: arm-lineage-template
    from: templates/arm/connectome/lineage.yaml
    to:
      - "<each arm>/.claude/connectome/lineage.yaml"
    kind: projects_to
    offrepo: true
    publish: "arm-onboarding step 6 seeds it; existing arms copy + tailor (arms resolved from company/config/arms-paths.json — never named here)"
    note: >-
      Every arm carries its OWN sealed lineage graph; impact-radius.py
      auto-detects it when run from inside the arm (layer=arm receipts).
      A contract change in the template must reach the arm seeds — and a
      schema change in impact-radius.py must stay compatible with both layers.

  - id: arm-onboarding
    concept: "arm onboarding / create a new client arm / new arm checklist"
    appears_in:
      - skills/arm-onboarding/SKILL.md      # canonical step-by-step
      - CLAUDE.md                           # Arm Onboarding quick reference
      - templates/arm/                      # the files every new arm is born with
      - docs/wiki/Glossary.md               # Arm onboarding entry
    kind: appears_in
    single_source: "skills/arm-onboarding/SKILL.md"
    note: >-
      Lights the unlit neuron filed by the 2026-06-04 GREP-FALLBACK. A new
      onboarding step (e.g. the arm lineage graph) must land in the skill AND
      its mirrors, or new arms are born without it.

  - id: brain-ci
    concept: "brain PR checks / required brain checks / CI gate octorato / counts-render check"
    appears_in:
      - .github/workflows/brain-pr-checks.yml   # los 4 jobs requeridos
      - scripts/check-generic.py                # job check-generic
      - scripts/generate_neural_map.py          # job connectome-rebuild
      - scripts/lineage-doctor.py               # job lineage-sound
      - scripts/sync-readme-counts.py           # job counts-render (junto con canon-render.py)
      - scripts/canon-render.py                 # job counts-render
    kind: appears_in
    single_source: ".github/workflows/brain-pr-checks.yml"
    note: >-
      Cada check requerido del brain mapea a su script ejecutor. Renombrar un
      job o mover un script sin reconciliar el otro lado rompe la protección
      de rama (check requerido que nunca reporta) — la misma clase de deadlock
      que el twin de Astro resolvió en un arm el 2026-06-04.

  - id: disclose-suggestions
    concept: "prune-suggestion / unlock-suggestion / disclose-time suggestions / dead cells / capability gap"
    appears_in:
      - CLAUDE.md                                   # ambas ULTRA RULES (☠ Prune + 💡 Unlock)
      - skills/4d-paradigm-protocol/SKILL.md        # protocolo Disclose completo
      - scripts/query_connectome.py                 # `dead` alimenta la sugerencia de poda
    kind: appears_in
    single_source: "CLAUDE.md"
    note: >-
      Las dos sugerencias de cierre (poda de células muertas y destrabe de
      límites de capacidad) son gemelas: el agente propone en una línea, el
      operador decide. Cambiar el formato de una exige reconciliar la otra.
      Enciende la neurona apagada filed el 2026-06-04.
