# connectome/lineage.yaml — the persistent surface/derivation graph.
#
# "El grafo es y ya." The neurons (files, surfaces, concepts) do not connect
# themselves; THIS file is the light that wires them. impact-radius.py SEEKS
# this graph (a deterministic traversal) instead of grep'ing the repo (a
# stochastic, input-dependent table scan that pixelates coverage).
#
# Why this exists: grep answers "which files happen to contain string X" —
# coverage changes with the input and misses off-repo + derived surfaces.
# A declared edge answers "what MUST stay in sync when this changes" — once,
# exactly, every time. Seek > scan: fewer tokens, higher speed, 100% coverage.
#
# Edge kinds:
#   projects_to    source is copied/rendered to derived locations; the derived
#                  copy goes STALE the instant the source changes (publish-time cp).
#   generated_by   target is GENERATED by a script — drift means "regenerate",
#                  NOT a hand-edit skip. Never hand-edit; never count as a miss.
#   claim_maps_to  a prose claim must map to a running file (the "this paper
#                  compiles" invariant — a claim without its file breaks the thesis).
#   appears_in     a shared fact (a count, a coined term) is duplicated in N
#                  places — converge to one value / single-source it.
#
# This file is hand-declared and GENERIC: never name a client arm here (the
# brain is public). Arms are referenced as "<each arm>", resolved at run time
# from the gitignored company/config/arms-paths.json.
#
# Grow it: every time impact-radius.py falls back to grep, it flags an "unlit
# neuron" — add the missing edge here so the next seek is deterministic.

version: 1

edges:
  - id: wiki-publish
    from: docs/wiki/
    to:
      - "octorato.wiki — the GitHub wiki (a SEPARATE repo)"
    kind: projects_to
    offrepo: true
    publish: "publish step = git clone octorato.wiki && cp docs/wiki/*.md (see docs/wiki/README.md)"
    note: >-
      docs/wiki/ is the SOURCE OF TRUTH. Editing the published wiki copy alone
      (without the source) is silently reverted on the next publish. This edge
      is the one that catches that exact skip.

  - id: claude-arm-sync
    from: CLAUDE.md
    to:
      - "<each arm>/.github/copilot-instructions.md"
      - "<each arm>/.cursorrules"
    kind: projects_to
    offrepo: true
    publish: "sync-ai-docs (arms resolved from company/config/arms-paths.json — never named here)"
    note: "A rules change in the brain must reach every arm's copilot/cursor mirror."

  - id: wiki-generated
    from: scripts/generate-octorato-wiki.py
    to:
      - docs/wiki/Home.md
      - docs/wiki/_Sidebar.md
      - docs/wiki/Skills.md
      - docs/wiki/Agents.md
    kind: generated_by
    note: >-
      Counts and lists on these pages are GENERATED from live skill/agent dirs.
      Drift here is "pending regeneration", NOT a hand-edit skip — do not hand-fix.

  - id: skill-count
    concept: "skill count"
    appears_in:
      - README.md
      - docs/wiki/Home.md
      - docs/wiki/_Sidebar.md
      - docs/wiki/Skills.md
      - WHITEPAPER.md
    kind: appears_in
    single_source: "live count of skills/*/SKILL.md; render via sync-readme-counts.py --floor"
    note: "One number, many copies. Change it once at the source and re-render; never hand-edit one copy."

  - id: agent-count
    concept: "agent count"
    appears_in:
      - README.md
      - docs/wiki/Home.md
      - docs/wiki/_Sidebar.md
      - docs/wiki/Agents.md
    kind: appears_in
    single_source: "live count of agents/*.md; render via sync-readme-counts.py --floor"

  - id: whitepaper-compiles
    from: WHITEPAPER.md
    concept: "every claim maps to a running file"
    to:
      - "WHITEPAPER.md §'Implementation — this paper compiles' table (one row per prose claim)"
    kind: claim_maps_to
    note: >-
      Adding a claim in the prose without a row in the compiles-table breaks the
      paper's whole thesis. This edge is the v3.0 same-file-neighbor skip.

  - id: version-bump
    concept: "brain version / release"
    appears_in:
      - CHANGELOG.md
      - WHITEPAPER.md
      - docs/wiki/Self-Growth.md
    kind: appears_in
    note: "A major version (e.g. v3.0) is announced in several places — bump them together."

  # The self-referential edge: the principle "graph before grep (seek > scan)"
  # is itself a concept that must live coherently across the whole brain. This
  # edge is the deterministic 100% target-set for codifying it — and proof that
  # the graph lights its own neuron (we found these by reflection, not grep).
  - id: graph-before-grep
    concept: "graph before grep / seek-not-scan / ¿y el grafo?"
    appears_in:
      - CLAUDE.md                              # §4D ULTRA RULE + Best-Tool-First + footer spec
      - scripts/4d-reminder.py                 # the Provenance footer "Graph:" field
      - scripts/connectome-heartbeat.py        # the latido reflex line
      - scripts/impact-radius.py               # the seek itself (grep = labeled fallback)
      - skills/4d-paradigm-protocol/SKILL.md   # cerebellum + 3D verifies graph-was-used
      - connectome/lineage.yaml                # this graph
      - WHITEPAPER.md                          # §7 Connectome = the index; seek not scan
      - CHANGELOG.md                           # the release entry
      - docs/wiki/The-4D-Paradigm.md           # §8 enforcement + §10 reflexive layer
      - skills/finops-observability/SKILL.md   # the ~100x seek-vs-scan token saving
      - scripts/brain_doctor.py                # an assertion: lineage.yaml present + seek wired
    kind: appears_in
    note: >-
      FinOps: a seek is ~100x cheaper than a scan per lookup (measured ~16 vs
      ~1737 tokens) and converges the WHILE in one beat. Codifying this concept
      must hit EVERY surface above in one deterministic sweep — pixelating it
      would be the very failure it cures.
