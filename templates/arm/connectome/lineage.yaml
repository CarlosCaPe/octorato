# <ARM>/.claude/connectome/lineage.yaml — the arm's own sealed lineage graph.
#
# Same contract as the brain's connectome/lineage.yaml, scoped to ONE arm:
# impact-radius.py auto-detects this file when run from inside the arm repo and
# traverses it INSTEAD of the brain's graph (Arm Isolation: one graph per seek,
# never merged across arms, never synced upward).
#
# Declare here what must stay in sync INSIDE this arm — deploy planes, generated
# artifacts, duplicated facts, prose claims that map to running files. Grow it
# the same way the brain grows: every GREP-FALLBACK files a candidate next to
# this file (lineage.unverified.yaml); promote real ones into edges.
#
# Edge kinds (identical semantics to the brain):
#   projects_to    source is copied/rendered elsewhere; derived copy goes stale
#   generated_by   target is generated by a script — regenerate, never hand-edit
#   claim_maps_to  a prose claim must map to a running file
#   appears_in     a shared fact duplicated in N places — single-source it
#
# Optional private layer: lineage.private.yaml (same dir) is read at seek time
# but should be gitignored if it names anything the arm repo must not record.

version: 1

edges:
  # Examples (uncomment / replace with real edges):
  #
  # - id: deploy-planes
  #   concept: "cron schedule"
  #   appears_in:
  #     - ops/scheduler/config.yaml
  #     - .github/workflows/daily.yml
  #     - docs/ops/runbook.md
  #   kind: appears_in
  #   single_source: "ops/scheduler/config.yaml"
  #   note: "One schedule, three planes — change it once, reconcile the mirrors."
  #
  # - id: site-build
  #   from: scripts/build_site.py
  #   to:
  #     - dist/
  #   kind: generated_by
  #   note: "dist/ is generated — never hand-edit, re-run the build."
